<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QC Review Queue</title>
<style>
  :root{
    --paper:#FAF9F5; --ink:#1B2430; --ink-soft:#5B6572; --line:#E4E1D8;
    --select:#2F6F62; --select-bg:#E7F1EE;
    --review:#B5791F; --review-bg:#FBF0DD;
    --reject:#AE3B2C; --reject-bg:#FBE9E6;
    --card:#FFFFFF; --accent:#2F6F62;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,"Inter",Segoe UI,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.5;
  }
  code, .mono, .badge, td.num{ font-family:"IBM Plex Mono","SF Mono",Consolas,monospace; }
  header{
    padding:28px 32px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  header h1{ font-size:19px; margin:0; letter-spacing:-0.01em; }
  header .sub{ color:var(--ink-soft); font-size:12.5px; margin-top:4px;}
  .stats{ display:flex; gap:10px; padding:18px 32px; flex-wrap:wrap; }
  .stat{
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:12px 16px; min-width:108px;
  }
  .stat .n{ font-size:22px; font-weight:600; font-family:"IBM Plex Mono",monospace; }
  .stat .l{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-top:2px;}
  .stat.select .n{ color:var(--select);} .stat.review .n{ color:var(--review);} .stat.reject .n{ color:var(--reject);}
  .toolbar{
    display:flex; gap:10px; align-items:center; padding:0 32px 16px; flex-wrap:wrap;
  }
  .toolbar input[type=text]{
    flex:1; min-width:200px; padding:8px 12px; border:1px solid var(--line); border-radius:6px;
    font-size:13px; background:var(--card);
  }
  .chip{
    padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card);
    font-size:12.5px; cursor:pointer; color:var(--ink-soft); user-select:none;
  }
  .chip.active{ border-color:transparent; color:#fff; }
  .chip[data-val="select"].active{ background:var(--select); }
  .chip[data-val="review"].active{ background:var(--review); }
  .chip[data-val="reject"].active{ background:var(--reject); }
  .chip[data-val="all"].active{ background:var(--ink); }
  select{ padding:7px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); font-size:12.5px; color:var(--ink);}
  main{ padding:0 32px 40px; }
  table{ width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);
    padding:10px 14px; border-bottom:1px solid var(--line); background:#F3F1EA; white-space:nowrap;
  }
  tbody td{ padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:#F6F5F0; }
  .q-preview{ max-width:360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .reason-preview{ max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-soft); }
  .badge{
    display:inline-block; padding:3px 9px; border-radius:5px; font-size:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:.03em;
  }
  .badge.select{ background:var(--select-bg); color:var(--select); }
  .badge.review{ background:var(--review-bg); color:var(--review); }
  .badge.reject{ background:var(--reject-bg); color:var(--reject); }
  .level{ font-size:12px; }
  .level .arrow{ color:var(--ink-soft); margin:0 3px; }
  .level .changed{ color:var(--reject); font-weight:600; }
  .empty{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  /* detail drawer */
  .backdrop{
    display:none; position:fixed; inset:0; background:rgba(27,36,48,.45); z-index:10;
    align-items:flex-start; justify-content:center; padding:40px 20px; overflow:auto;
  }
  .backdrop.open{ display:flex; }
  .drawer{
    background:var(--paper); border-radius:10px; max-width:720px; width:100%;
    padding:28px 30px 30px; box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .drawer h2{ font-size:15px; margin:0 0 2px; }
  .drawer .drawer-sub{ font-size:12px; color:var(--ink-soft); margin-bottom:18px; }
  .drawer-close{
    float:right; background:none; border:1px solid var(--line); border-radius:6px; width:28px; height:28px;
    cursor:pointer; font-size:14px; color:var(--ink-soft);
  }
  .block{ margin-bottom:16px; }
  .block .k{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:5px; }
  .block .v{ font-size:13.5px; white-space:pre-wrap; }
  footer{ padding:16px 32px 32px; color:var(--ink-soft); font-size:11.5px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>QC Review Queue</h1>
    <div class="sub">Content and level QC &mdash; final call on whether an item goes to a student</div>
  </div>
  <div class="sub" id="generated-sub"></div>
</header>

<div class="stats" id="stats"></div>

<div class="toolbar">
  <input type="text" id="search" placeholder="Search text, reasons...">
  <div class="chip active" data-val="all">All</div>
  <div class="chip" data-val="select">Select</div>
  <div class="chip" data-val="review">Review</div>
  <div class="chip" data-val="reject">Reject</div>
  <select id="skill-filter"><option value="">All skills</option></select>
  <select id="level-filter"><option value="">All levels</option></select>
</div>

<main>
  <table>
    <thead>
      <tr>
        <th>Question ID</th><th>Skill</th><th>Text</th><th>Level</th>
        <th>Decision</th><th>Reason</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none;">No items match these filters.</div>
</main>

<footer>Click any row for the full QC breakdown (rule flags, level reasoning).</footer>

<div class="backdrop" id="backdrop">
  <div class="drawer" id="drawer"></div>
</div>

<script>
const DATA = [{"question_id": "877c9217-b514-4cd5-b6f1-295d40a961ad", "skill": "writing", "text": "You are a third-year doctoral researcher conducting a mixed-methods longitudinal study on the impacts of remote laboratory simulations in undergraduate engineering education. After initiating the pilot phase, you discovered methodological issues that could materially undermine the validity and reliability of your findings. Write a letter to your principal supervisor explaining the situation and proposing a way forward. The tone should be formal but collegial: you must convey the urgency and complexity of the problem while demonstrating scholarly judgment.\n\nIn your letter, include the following:\n- A concise, technically precise description of the methodological problem(s) identified during the pilot (for example, sampling bias, instrument inadequacy, temporal confounds, or measurement unreliability), and an analysis of how these issues threaten the study's internal and external validity as well as any ethical ramifications for participants or data integrity.\n- Two alternative methodological strategies to redress the problem (for example, revising the sampling frame, replacing or recalibrating instruments, implementing triangulation, or adjusting data-collection intervals), with reasoned justification for each alternative and an assessment of their likely impact on the research timeline, budget, and analytic approach.\n- A specific, actionable request for support: indicate what approvals (e.g. ethics amendment), resources (e.g. additional funding, technical assistance, participant recruitment support), or supervisory decisions you require, propose a revised timetable with clear milestones, and suggest a deadline by which you need the supervisor's guidance to avoid compromising the project.\n\nWrite at least 150 words.", "level": "C1", "predicted_level": "C1", "level_change_reason": "The prompt requires the use of highly specialized academic vocabulary and the ability to communicate complex, abstract methodological concepts for professional and academic purposes.", "qc_label": "REJECT", "qc_reason": "Fairness (requires specialist or cultural knowledge): The prompt requires advanced knowledge of research methodology and specific academic terminology (e.g., temporal confounds, triangulation, internal/external validity) that is outside the scope of general language proficiency.", "metric_flags": "none", "elapsed_sec": 44.561}, {"question_id": "b472f08c-4a7c-4666-9056-d409cdaaa2a1", "skill": "writing", "text": "You have accepted a new job and will leave your current position at a small marketing company in two weeks. You will hand over your projects to a colleague who has agreed to take them. Write a letter to this colleague. In your letter, include the following:\n\n- Explain why you are leaving and say on which day your last working day will be. (You can mention the new job briefly.)\n- Describe the main tasks they will need to do and any important contacts or files they should know about. Mention the word \"handover\" (giving your tasks and information to the next person) if you like.\n- Offer help during the handover period and give your contact details so they can reach you after you leave.\n\nWrite at least 150 words. You should spend about 20 minutes.", "level": "B1", "predicted_level": "B1", "level_change_reason": "The task requires describing a familiar work-related situation and providing information, which aligns with B1 descriptors for handling familiar matters and using a range of tenses.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 60.97}, {"question_id": "2b3ef21c-7c34-47a5-826b-b256c3342a85", "skill": "writing", "text": "Technology is part of everyday life. Many people say that using devices such as smartphones, computers and smart home tools makes life easier. They can help with work, study and speaking to friends. Other people say technology causes problems, for example less face-to-face contact, distraction and risks to privacy (keeping personal information safe).\n\nDiscuss both views and give your own opinion.\n\nIn your essay, include the following:\n1. Examples of ways technology helps people in daily life (at home, at work, or at school).\n2. Problems that come from using technology too much, using simple examples.\n3. Your opinion and reasons, and one or two suggestions to make technology use better for families or individuals.\n\nWrite at least 250 words.", "level": "B1", "predicted_level": "B1", "level_change_reason": "The prompt uses clear, standard vocabulary on a familiar topic and asks the learner to express opinions and describe experiences using common grammatical structures.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 51.121}, {"question_id": "e2c25798-7376-466f-ba30-4662b40a8970", "skill": "writing", "text": "You are the convenor of the Eastport Historical Society. A highly anticipated monograph-due to be published next month by Westbridge University Press-relies heavily on documents from the Central Record Office (CRO) that your society has curated for decades. In preparing for the book's publication you discovered that a number of primary sources cited in the manuscript are either miscatalogued, lack provenance notes, or omit testimonies from Indigenous and other marginalised communities whose voices materially alter the interpretive thrust of the author's thesis. Because the book will shape both public understanding and subsequent scholarship, you believe urgent corrective action is necessary.\n\nWrite a formal letter to the Editor-in-Chief of Westbridge University Press. In your letter, include the following:\n- Explain concisely but persuasively why these archival discrepancies and omissions are historiographically consequential, making explicit the ethical and epistemic risks of proceeding without rectification.\n- Provide at least two specific examples (catalogue reference numbers, dates, or document titles) that illustrate the errors or lacunae, and propose concrete remedial measures (for example: corrigendum, erratum, delayed publication, joint verification of sources, or community consultation).\n- Propose a practicable timetable and collaborative protocol for how the press, the author, the CRO, and your society might verify the contested material, amend the record where necessary, and communicate any changes to the scholarly community and general public.\n\nWrite at least 150 words. You should spend about 20 minutes on this task.", "level": "C2", "predicted_level": "C1", "level_change_reason": "Changed from C2 to C1: The prompt utilizes highly specialized academic vocabulary and complex sentence structures, requiring the production of nuanced, professional text for academic purposes.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 91.978}, {"question_id": "812bf813-cd1e-47a2-b0d1-6b3b9a9de5e8", "skill": "writing", "text": "You are the convenor of a forthcoming special issue of a leading comparative literature journal that juxtaposes contemporary postcolonial narrative strategies with metropolitan modernisms. Several invited contributors and the translations they supplied have become the focus of a fraught dispute: some authors contest editorial amendments to translated passages, while others dispute proper attribution and the epistemic framing of region-specific hermeneutics. The disagreement now threatens to delay the issue and to damage collegial relations among the contributors.\n\nWrite a letter to Professor Morgan Patel, a senior editor and respected arbiter in the field, asking for urgent assistance to resolve the matter. In your letter, include the following:\n\n- A concise but nuanced exposition of the problems, making explicit why these matters are ethically and intellectually sensitive (e.g. translation fidelity, attribution, theoretical framing), and how they jeopardise both the project and professional relationships.\n- A critical appraisal of two distinct courses of action to defuse the conflict (for example: instituting a transparent translation protocol and independent external review vs. publishing a bifurcated issue with extended editorial commentary), explaining the benefits and potential liabilities of each, and arguing for the option you consider most defensible.\n- A clear, practicable request for the assistance you want from Professor Patel (such as chairing a mediation meeting, endorsing specified editorial criteria, or helping to set a firm timeline), together with proposed immediate steps and an explicit timetable for resolution.\n\nWrite at least 150 words. You should spend about 20 minutes.", "level": "C2", "predicted_level": "C1", "level_change_reason": "Changed from C2 to C1: The text employs highly specialized academic vocabulary and complex, formal sentence structures characteristic of advanced professional and academic discourse.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 83.591}, {"question_id": "e94bab00-7f11-46c8-9549-e4ee1941c305", "skill": "writing", "text": "You are a resident of Brookside, a small town where the Town Council has recently announced a new public policy to pedestrianise the High Street from 10:00 to 18:00, six days a week. The measure is intended to improve air quality and encourage footfall, but it will restrict vehicle access and limit delivery times to early mornings. The policy is due to take effect next month and many residents and local businesses feel they were not sufficiently consulted.\n\nWrite a formal letter to the Chair of the Town Council expressing your concerns about the new pedestrianisation policy. In your letter, include the following:\n- Explain how this policy will affect you, your household or your business, and why you are concerned (include specific examples and consequences).\n- Propose at least two practical alternatives or modifications that would reduce negative impacts while still achieving the council's aims.\n- Request a clear action from the council (for example, a public meeting, an impact assessment, or a postponement) and state the outcome you hope for.\n\nWrite at least 150 words. You should spend about 20 minutes on this task.", "level": "B2", "predicted_level": "B2", "level_change_reason": "The task requires the use of formal register, complex argumentation, and specialized vocabulary such as 'pedestrianise' and 'impact assessment'.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 44.0}, {"question_id": "04e0e1e2-8748-4de8-b379-c416f138f82a", "skill": "writing", "text": "Write a problem-solution essay on the topic below.\n\nMany people today are not physically active and do not eat a healthy diet. This leads to serious health problems such as obesity (being very overweight), heart disease (problems with the heart) and high stress. These issues can affect individuals, families and the wider community.\n\nIn your essay, include the following:\n1. Describe the main problems caused by a lack of fitness and poor eating habits. Give clear examples of physical and mental health effects and any social or economic consequences.\n2. Suggest practical solutions that could help people become healthier. Consider what individuals, schools or workplaces, and governments can do to encourage better habits.\n3. Explain which of your suggested solutions you think are most important and why. Consider costs, ease of use and long-term benefits.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "B1", "predicted_level": "B2", "level_change_reason": "Changed from B1 to B2: The task requires a structured essay on an abstract social issue, necessitating nuanced vocabulary and the ability to evaluate solutions based on multiple criteria.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 35.293}, {"question_id": "2d6aa98f-e376-4c6a-b921-6a606c8e373e", "skill": "writing", "text": "Some people believe that governments should spend more money on public sports facilities (places like parks, playgrounds, swimming pools and community gyms) so that people can exercise easily and stay healthy. They say this will prevent illness and lower health costs in the long term. Others think the government should use the money for hospitals and medical care to treat people who are already sick. They argue that good medical services are more urgent than new sports facilities. Discuss both views and give your own opinion.\n\nWrite at least 250 words.", "level": "B1", "predicted_level": "B2", "level_change_reason": "Changed from B1 to B2: The prompt requires discussing abstract social issues using complex sentence structures and academic vocabulary typical of upper-intermediate argumentation.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 29.98}, {"question_id": "5c78a350-6f92-40b0-b90d-6703cd5e5ca6", "skill": "writing", "text": "You write a short note to your friend. Tell them about your family. Write a postcard. In your letter, include the following:\n- Start with \"Dear\" and say hello.\n- Say who is in your family and one small fact about one person.\n- Invite your friend to come to your home to meet your family.\n\nWrite at least 40 words.", "level": "A1", "predicted_level": "A1", "level_change_reason": "The task requires only high-frequency vocabulary and simple present tense to convey basic personal information and simple facts.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 31.098}, {"question_id": "b63a7a65-df0d-419c-a3ad-2474c2f5cbd9", "skill": "writing", "text": "You write a short note to your friend. You tell your friend about your day. Start with a greeting and end with a short closing.\n\nIn your letter, include the following:\n- What time you wake up and one thing you do first.\n- One thing you do at school or work.\n- What time you go to bed and why.\n\nWrite at least 40 words. You have 10 minutes.", "level": "A1", "predicted_level": "A2", "level_change_reason": "Changed from A1 to A2: The task requires describing a daily routine using everyday vocabulary and a simple connector to explain a reason, which aligns with the A2 descriptor.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 43.526}, {"question_id": "436f8da4-649e-4da6-9941-c59907eeb1e2", "skill": "writing", "text": "You recently attended a small cultural festival in your town and want to tell a friend who now lives in another city about it. Write a letter to your friend. In your letter, include the following:\n\n- Describe the event and the parts you enjoyed most (for example, a parade - a procession with music and colourful costumes - or a food stall serving traditional dishes). Use clear, simple details so your friend can imagine it.\n- Explain why this event is important to your community and what it shows about local culture (you can mention music, dance, crafts, or food traditions).\n- Invite your friend to the next festival: give the date or season, the place, and suggest how they could get there and what they should bring or expect.\n\nWrite in a friendly, informal tone as if you are writing to someone you know well.\n\nWrite at least 150 words.", "level": "B1", "predicted_level": "B1", "level_change_reason": "The task requires describing personal experiences, explaining cultural significance, and making arrangements, which aligns with B1 descriptors for handling familiar topics and expressing opinions.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 31.759}, {"question_id": "909deca6-b8bf-464d-a300-c048994e33ff", "skill": "writing", "text": "Many countries are promoting renewable energy sources, yet the transition from fossil fuels remains slow in several regions. Write a problem-solution essay in which you examine the main problems that hinder wider adoption of renewable energy and propose practical solutions to overcome these difficulties. In your essay, include the following:\n\n1. Analysis of the key problems, such as financial costs, infrastructure limitations, and public attitudes or misinformation.\n2. Consideration of technological and regulatory barriers that make implementation challenging.\n3. Specific, realistic solutions that governments, businesses, and communities could adopt (for example, policy incentives, investment in grid upgrades, public education, or international cooperation).\n4. Evaluation of which solutions are most likely to succeed and why, including potential obstacles to their implementation.\n\nWrite at least 250 words.", "level": "B2", "predicted_level": "B2", "level_change_reason": "The prompt uses academic vocabulary and complex sentence structures to describe a task involving abstract topics and detailed analysis.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 60.811}, {"question_id": "4f16e763-bc60-43e9-b870-b32cc69fa162", "skill": "writing", "text": "You have just adopted a new pet and you want to tell your friend about it. Write a short informal letter to your friend. In your letter, include the following:\n\n- Say what kind of pet it is, its name, and what it looks like, and say why you chose it.\n- Say how you care for the pet and if there is any problem when you look after it, because your friend may give advice.\n- Invite your friend to come and meet the pet, and suggest a day and time when you are free.\n\nWrite at least 60 words. You have 15 minutes.", "level": "A2", "predicted_level": "A2", "level_change_reason": "The task focuses on everyday vocabulary and personal information of immediate relevance, such as describing a pet and making simple social invitations.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 37.734}, {"question_id": "096f8129-c6a8-4150-bd98-99c86578ce51", "skill": "writing", "text": "You have recently moved to a new neighbourhood. A friend told you about a nearby community fitness centre and suggested that you try some classes there. You want to join but have a few questions before you start.\n\nWrite a letter to your friend. In your letter, include the following:\n- Ask which types of classes at the centre are best for beginners and why these are suitable (explain briefly what you mean by beginner-friendly).\n- Ask about the centre's opening hours, typical class times, and the cost or membership options (mention if discounts are available).\n- Ask for practical tips to stay motivated during the first month and whether your friend can come with you to the first class.\n\nWrite at least 150 words. You should spend about 20 minutes on this task.", "level": "B1", "predicted_level": "B1", "level_change_reason": "The task requires communicating about familiar social topics (leisure/fitness) and involves explaining reasons and asking for advice, which aligns with B1 descriptors.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 52.727}, {"question_id": "e1985d03-42d0-4f4d-9138-2b1ca011d9f5", "skill": "writing", "text": "You are going to visit your friend Sara next Saturday, but your family will have a small party that day. Write a letter to Sara. In your letter, include the following:\n- Explain why you cannot come on the planned day. Use simple words like \"because\" or \"so\".\n- Suggest a new day to visit and ask if this day is good for her.\n- Say what you can bring and ask about any plans for the visit.\n\nWrite at least 60 words. Spend about 15 minutes.", "level": "A2", "predicted_level": "A2", "level_change_reason": "The task focuses on immediate personal relevance using high-frequency vocabulary and explicitly instructs the use of simple connectors like 'because' and 'so'.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 28.723}, {"question_id": "56c57102-6c73-40cf-9fd8-228b62da0cb7", "skill": "writing", "text": "You went to a new shop in your town last week. You bought a shirt and a pair of shoes. When you got home, the shirt was the wrong size and the shoes had a mark. Write a short informal letter to your friend. In your letter, include the following:\n- Say what you bought and describe the problems with the items.\n- Say what you want the shop to do or what you will do next because of the problem.\n- Ask your friend for advice and say when you can meet to go back to the shop.\n\nWrite at least 60 words. You have 15 minutes.", "level": "A2", "predicted_level": "A2", "level_change_reason": "The prompt requires the use of simple past tense and high-frequency everyday vocabulary related to shopping and immediate personal relevance.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 28.96}, {"question_id": "4ac5d640-73fd-41b6-a539-6b4ba7e2abee", "skill": "writing", "text": "Historiography - the study of how history is written, interpreted and revised - has become a contested terrain. Some scholars insist that the historian's primary obligation is to pursue disinterested, evidence-driven reconstructions of the past, thereby insulating historical knowledge from present-day political exigencies. Others maintain that purported neutrality is a chimera and that historians must acknowledge their normative commitments, foreground silenced actors, and deploy history as an instrument of social redress. Discuss both views and give your own opinion. In your essay, include the following: 1) an appraisal of the epistemological foundations of 'objectivity' compared with advocacy in historical methodology; 2) the ethical responsibilities historians owe to archival sources, descendant communities and living memory; 3) the practical ramifications for public history, school curricula and policy when historiographical paradigms change.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "C2", "predicted_level": "C1", "level_change_reason": "Changed from C2 to C1: The text employs highly specialized academic vocabulary and complex, multi-clause sentence structures characteristic of advanced scholarly discourse.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 60.401}, {"question_id": "ca22aa1c-692b-4c90-b707-17b40e36b25b", "skill": "writing", "text": "You have been accepted onto a six-week English course at Riverside Community College that starts next month. Write a letter to the course coordinator to ask for more information and to explain your situation. In your letter, include the following:\n\n- Confirm the course start date and weekly timetable, and ask whether there are evening or weekend class options (useful if you work part-time).\n- Ask which textbooks or other materials you will need and whether you must take a placement test before the course (a placement test checks your current level).\n- Ask about accommodation and student support services, for example whether the college can suggest nearby host families, student halls, or help with arrival arrangements.\n\nWrite at least 150 words. You should spend about 20 minutes.", "level": "B1", "predicted_level": "B1", "level_change_reason": "The task requires handling a familiar academic situation using specific vocabulary and a range of sentence structures to request information.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 259.17}, {"question_id": "aa388d59-5498-4fcd-8980-a38ffecfd825", "skill": "writing", "text": "You are an independent historian who has been invited to contribute as a guest curator to a forthcoming municipal exhibition on twentieth-century social movements. Having examined the provisional script and object list, you believe the narrative as drafted elides essential archival evidence, perpetuates a monolithic national myth, and poses ethical problems for responsible public history. Write a letter to Dr Sarah Mitchell, Director of the Municipal Museum, setting out your position and the steps you think should be taken.\n\nIn your letter, include the following:\n- A succinct, analytically precise account of your historiographical and ethical objections to the draft narrative, referring to issues such as archival silences, selective memory, presentist recontextualisation, and the risks of uncritical teleology.\n- Specific methodological and curatorial measures you recommend to restore evidentiary balance and interpretive plurality (for example, provenance statements, juxtaposed primary-source vignettes, community co-curation, annotated disclaimers, or a formal peer review), and how these would mitigate the problems you identify.\n- The concrete action you intend to take and the assistance or commitments you are requesting from Dr Mitchell (for instance, a meeting, commissioning an independent review, a temporary pause to public communications, or conditional acceptance of curatorial responsibilities), together with the professional outcomes you expect to secure for the institution and for public trust in historical interpretation.\n\nWrite at least 150 words. You should spend about 20 minutes on this task.", "level": "C2", "predicted_level": "C1", "level_change_reason": "Changed from C2 to C1: The prompt requires the use of highly specialized academic vocabulary and the ability to construct complex, nuanced arguments for professional and academic purposes.", "qc_label": "REJECT", "qc_reason": "Fairness (requires specialist or cultural knowledge): The task requires advanced knowledge of historiographical and curatorial theory (e.g., teleology, archival silences) that goes beyond testing language proficiency and enters the realm of specialized academic training.; predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 73.204}, {"question_id": "2f1f5b8a-49e6-4cd1-89a0-c51e423ad2af", "skill": "writing", "text": "You have started at a new school this term. Write a letter to your friend Sam, who is at your old school. In your letter, include the following:\n\n- Say why you are writing and how you feel about the new school and your new class.\n- Describe one problem you have at school and ask Sam for advice or help.\n- Invite Sam to visit your new school or to meet after school, and say a day or time that is good for you.\n\nWrite at least 60 words.", "level": "A2", "predicted_level": "B1", "level_change_reason": "Changed from A2 to B1: The task requires describing experiences, feelings, and asking for advice, which aligns with the B1 descriptor for describing opinions and handling familiar social matters.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 52.017}, {"question_id": "6b57b6dc-bbaf-49fc-bb6e-abdb026fa10b", "skill": "writing", "text": "Advances in neuroscience - including neuroimaging, cognitive biometrics and predictive algorithms based on brain data - are increasingly touted as tools that could optimise recruitment, performance appraisal and insurance underwriting. Proponents argue that such techniques promise objective insight into aptitudes, mental health and risk propensity, thereby enhancing efficiency and fairness. Critics, however, contend that the collection and use of neural data threaten individual privacy, may entrench discrimination, and could be misapplied by organisations with commercial incentives.\n\nDiscuss both views and give your own opinion. In your essay, include the following points:\n- The potential advantages of applying neuroscientific tools in employment and insurance contexts (for example, improved matching, early intervention, reduced subjective bias).\n- The ethical, legal and social concerns these applications raise (for example, privacy infringement, consent, inequitable access, stigmatization).\n- What measures, if any, should governments, professional bodies or organisations implement to govern the use of brain-derived data.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "C1", "predicted_level": "C1", "level_change_reason": "The text employs highly specialized academic vocabulary and complex syntactic structures to discuss abstract and technical topics.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 34.318}, {"question_id": "955d0859-7d36-4336-bd48-e474a6e9626e", "skill": "writing", "text": "You missed school for two days because you were ill. Write a letter to your classmate Anna. In your letter, include the following:\n- Say why you were absent and how you feel now.\n- Explain how you will catch up with the homework and class notes.\n- Ask Anna if she can help you and suggest a time to meet.\n\nWrite at least 60 words. You have 15 minutes.", "level": "A2", "predicted_level": "A2", "level_change_reason": "The prompt requires using simple past, present, and future tenses to describe a personal situation using everyday vocabulary and common connectors.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 32.144}, {"question_id": "e8cee2cd-b086-48aa-bafc-4ebed8009594", "skill": "writing", "text": "You have a friend who is planning a short holiday to your town next month. They have never visited before and have asked you for help to plan the trip. Write a letter to your friend giving advice and useful details.\n\nIn your letter, include the following:\n- Recommend two or three places to visit and say why each place is interesting (mention one must-see attraction).\n- Suggest where to stay (for example a hotel, guesthouse, or hostel), explain how to get there from the airport and give an idea of cost and travel time.\n- Describe local transport options (bus, tram, taxi, or bike hire) and give one or two cultural tips or safety advice to help them enjoy their visit.\n\nWrite at least 150 words. You should spend about 20 minutes on this task.", "level": "B1", "predicted_level": "B1", "level_change_reason": "The task requires describing familiar topics (travel and local area) and providing advice/explanations, which aligns with B1 descriptors for handling travel situations and expressing opinions.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 41.048}, {"question_id": "a7926328-555e-483e-8cf7-3bb1df16f414", "skill": "writing", "text": "Social media and other digital platforms have dramatically changed the ways people communicate, form communities, and access information. Some people believe these developments have strengthened social ties, encouraged civic engagement and made information more accessible; others argue that they have eroded privacy, increased polarization and weakened face-to-face relationships. Discuss both views and give your own opinion. In your essay, include the following points:\n\n- Explain the main benefits of social media and digital culture for communication, information sharing and community building.\n- Describe the key disadvantages and potential harms, such as effects on mental health, privacy concerns, misinformation and reduced quality of real-life interactions.\n- Suggest realistic measures that individuals, technology companies or governments could take to reduce the negative consequences while preserving the advantages.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "B2", "predicted_level": "B2", "level_change_reason": "The prompt utilizes nuanced academic vocabulary and complex sentence structures to address abstract societal issues.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 43.299}, {"question_id": "a22e14c8-41fe-46de-8fec-c097474ff02f", "skill": "writing", "text": "You have just moved to a new city and your friend Anna lives there. Write a letter to Anna to ask for help with local transport. In your letter, include the following:\n\n- Ask how to go from your home to your work by bus or train, and ask the bus or train name or number.\n- Say when you will visit Anna and ask how long the trip takes and how much the ticket costs.\n- Ask if it is easy to buy a monthly travel pass, and ask where you can buy it.\n\nWrite at least 60 words.", "level": "A2", "predicted_level": "A2", "level_change_reason": "The prompt focuses on immediate relevance (local transport) and requires the use of everyday vocabulary and simple grammatical structures like basic questions and the future tense.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 31.621}, {"question_id": "3864a2ae-66f1-46ab-ac11-a2aafdf05a2b", "skill": "writing", "text": "You looked after your friend's cat for one week while they were away. Write a short informal letter to your friend. Start with a thank you and tell them what happened while they were away.\n\nIn your letter, include the following:\n- Describe the cat, its name and how it behaved when you fed or played with it.\n- Say what you did each day to look after the cat, and say one thing you liked about it.\n- Say if you had any small problems and ask one question about the cat or its care.\n\nWrite at least 60 words.", "level": "A2", "predicted_level": "A2", "level_change_reason": "The task requires using simple past tense and everyday vocabulary to describe a personal, immediate experience.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 27.297}, {"question_id": "75dc7ca1-f4cc-481c-a840-9b0edd3bedba", "skill": "writing", "text": "Advances in genome-editing technologies, especially CRISPR-Cas systems, have made the prospect of altering human embryos to eradicate hereditary diseases increasingly plausible. Proponents argue that permitting such interventions would alleviate suffering, reduce long-term healthcare burdens and represent a moral imperative to prevent avoidable illness. Critics, however, warn that germline modification could precipitate unforeseen biological risks, exacerbate social inequalities through 'designer' enhancements, and erode foundational ethical principles regarding human integrity. Discuss both sides of this contentious issue and present your own reasoned position. In your essay, include the following: \n\n- an appraisal of the chief ethical considerations (for example, autonomy, beneficence, justice and non-maleficence);\n- analysis of potential social and economic consequences, including the risk of widening inequality;\n- evaluation of regulatory and practical safeguards that might mitigate risks; and\n- consideration of who should be empowered to make decisions about permissible interventions (scientists, governments, international bodies, or the public).\n\nWrite at least 250 words.", "level": "C1", "predicted_level": "C1", "level_change_reason": "The prompt utilizes highly specialized academic vocabulary and complex grammatical structures to address abstract, technical, and ethical topics.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 52.624}, {"question_id": "a6baf3b2-14ec-48e0-96ce-14e0abc0cc73", "skill": "writing", "text": "Many people, especially young adults, find it hard to manage their money. They may spend too much, borrow and get into debt, or fail to save for the future. These problems can cause stress and make it difficult to pay for important things such as housing or education.\n\nWrite a problem-solution essay. Explain the main problems that cause money difficulties and suggest practical solutions. In your essay, include the following:\n- The main reasons why people, especially young adults, have trouble with money (for example: lack of basic knowledge, easy access to credit, or social pressure).\n- The effects of these money problems on individuals or families.\n- Two or three useful solutions, showing what people themselves can do and what schools or governments could do to help.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "B1", "predicted_level": "B2", "level_change_reason": "Changed from B1 to B2: The task requires discussing abstract social issues and structuring a formal essay using nuanced vocabulary and complex sentence structures.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 35.929}, {"question_id": "2fd1b301-5656-484c-98e2-fd32e938c07e", "skill": "writing", "text": "You want to write a short note to a friend about the colours you like.\n\nIn your letter, include the following:\n- Say which colour you like most.\n- Say why you like this colour.\n- Say one thing you have in this colour.\n\nStart with 'Hi'. End with 'Bye' and your name.\n\nWrite at least 40 words.", "level": "A1", "predicted_level": "A1", "level_change_reason": "The task requires only high-frequency vocabulary and basic present tense structures to express simple personal facts.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 25.741}, {"question_id": "9bff64af-e821-4829-8614-b7eeeceb0ee5", "skill": "writing", "text": "You have a new pet. Write a short note to your friend. Say hello at the start. Say bye at the end.\n\nIn your letter, include the following:\n- the pet's name and age\n- what the pet likes to do each day\n- one funny thing your pet does\n\nWrite at least 40 words.", "level": "A1", "predicted_level": "A1", "level_change_reason": "The task requires only basic facts (name, age), simple present tense for routines, and high-frequency vocabulary.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 62.109}, {"question_id": "1e421390-cc90-478a-8bc5-13b6ec52e1c8", "skill": "writing", "text": "Write a problem-solution essay on the topic below.\n\nClimate change is one of the most pressing problems facing the world today. Rising temperatures, extreme weather events and sea-level rise threaten ecosystems, economies and human wellbeing. While scientific and technological advances offer potential remedies, political, social and personal barriers often slow effective action.\n\nIn your essay, include the following:\n1. Describe the most significant causes of climate change, explaining how human activity contributes to the problem.\n2. Explain the main effects that these causes have on communities and the natural environment.\n3. Propose practical and realistic solutions that could be implemented by both governments and individuals.\n4. Evaluate which measures are likely to be most effective and justify your opinion with reasons and examples.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "B2", "predicted_level": "B2", "level_change_reason": "The prompt uses academic vocabulary and requires a detailed response on an abstract topic using complex grammatical structures.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 61.475}, {"question_id": "b4253e77-ad24-4358-8d7e-7cf07fc8e5da", "skill": "writing", "text": "Many people today do not do enough physical exercise. This causes health problems such as obesity, heart disease and low energy. Why are people less active now? What can be done to encourage more exercise at home, at work and in the community?\n\nIn your essay, include the following:\n- Describe the main reasons why people are not active enough (for example, work, transport, technology, or lack of safe places to exercise).\n- Suggest practical solutions that individuals, employers and local governments can use to increase physical activity.\n- Give one example or idea you think would be most effective and explain why.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "B1", "predicted_level": "B2", "level_change_reason": "Changed from B1 to B2: The prompt requires discussing abstract societal issues and providing structured arguments using nuanced vocabulary and complex sentence structures.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 34.094}, {"question_id": "222b9ca8-764a-41da-b29f-e48536dcddbb", "skill": "writing", "text": "Comparative literature has traditionally sought patterns and correspondences across languages, epochs and cultures; yet, in recent decades, the discipline has been riven by competing mandates. One school of thought contends that comparative literature must undergo a paradigmatic overhaul - foregrounding transnational exchange, privileging marginalised canons, and actively decolonising curricula so as to redress historical asymmetries in literary valuation. Another influential perspective argues that comparative work should retain its commitment to rigorous theoretical frameworks and aesthetic criteria that enable formal comparison across disparate texts, warning that an excessive emphasis on identity politics or local particularities risks fragmenting the field and attenuating its analytical rigour. Discuss both views and give your own reasoned position on how comparative literature should evolve as an academic discipline. In your essay, include the following:\n\n1. A critical appraisal of the arguments for decolonising the canon and prioritising intercultural dialogue, with attention to epistemic justice and representational equity.\n2. An evaluation of the counter-arguments that advocate methodological continuity, universalist theoretical tools, and the preservation of shared critical standards.\n3. Consideration of practical ramifications: how should these orientations shape graduate curricula, research agendas, and the role of comparative literature in cultural diplomacy and public humanities?\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "C2", "predicted_level": "C1", "level_change_reason": "Changed from C2 to C1: The text employs highly specialized academic vocabulary and complex, multi-clause grammatical structures characteristic of advanced academic discourse.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 69.615}, {"question_id": "4e926c9d-5df1-4f2e-8371-20f3a6a5eee9", "skill": "writing", "text": "Rapid progress in neuroscience has brought within reach a range of interventions that can alter cognition and behaviour - from pharmacological cognitive enhancers and non-invasive brain stimulation to invasive neural implants and brain-computer interfaces. Proponents argue that such technologies could markedly improve learning, productivity and mental health, and thus ought to be made widely accessible and integrated into education and healthcare. Critics, however, warn that cognitive enhancement may exacerbate social inequality, compromise personal autonomy and identity, create novel forms of coercion, and generate unprecedented privacy and security risks. Discuss both views and give your own opinion. In your essay, where relevant, consider ethical, social and practical dimensions and outline any policy measures that might reasonably be adopted to address the concerns raised.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "C1", "predicted_level": "C1", "level_change_reason": "The text employs highly specialized academic vocabulary and complex sentence structures to discuss abstract, multi-dimensional topics typical of advanced proficiency.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 33.512}, {"question_id": "4e0030cc-1dbc-4ba4-8044-39233e346673", "skill": "writing", "text": "You have recently moved to a new country and have received an official letter from the national identity authority requesting additional documents to complete your resident ID application. A volunteer at the local immigrant support organisation, who you have met once, has offered to help you with this matter.\n\nWrite a letter to this volunteer.\n\nIn your letter, include the following:\n- Explain briefly why you moved here and summarise the request you received from the identity authority, including any deadline or consequences mentioned.\n- Describe which documents you can provide immediately and which are difficult to obtain, giving reasons (for example, documents still in your home country, language barriers, or lost paperwork).\n- Ask for specific help from the volunteer: suggest two concrete ways they could assist you (such as contacting the authority, translating documents, accompanying you to appointments, or advising on acceptable alternatives) and explain how delays in resolving the matter would affect your ability to settle in and your sense of identity.\n\nWrite at least 150 words. You should spend about 20 minutes.", "level": "B2", "predicted_level": "B2", "level_change_reason": "The prompt requires the writer to handle complex bureaucratic information and discuss abstract concepts like 'sense of identity,' necessitating nuanced vocabulary and complex grammatical structures.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 36.216}, {"question_id": "6d867fab-dd66-4af6-b0f1-69b1e1d7a759", "skill": "writing", "text": "You see fresh fruit and green vegetables at the market. Write a short note to a friend. Start with a greeting and end with a short closing. In your letter, include the following:\n- Which fruit or vegetable you like.\n- Where you buy them.\n- Ask your friend to come with you or to bring some.\n\nWrite at least 40 words. Spend about 10 minutes.", "level": "A1", "predicted_level": "A2", "level_change_reason": "Changed from A1 to A2: The task focuses on immediate relevance (shopping and food) using high-frequency vocabulary and simple functional language for personal communication.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 32.919}, {"question_id": "bd4a98fd-8acd-4274-a79e-47491fe4910d", "skill": "writing", "text": "You are going on a short trip and will be away for one week. Write a letter to your friend who will look after your dog while you are away. In your letter, include the following:\n- When and how to feed and walk the dog, and any daily routine.\n- Any medicine or special care the dog needs and what to do if the dog is unwell.\n- Ask your friend to send one or two photos and say thank you.\nWrite a short, friendly letter with a clear opening and a simple closing.\n\nWrite at least 60 words. You have 15 minutes.", "level": "A2", "predicted_level": "A2", "level_change_reason": "The prompt focuses on everyday vocabulary and immediate personal relevance regarding routine and simple instructions.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 34.652}, {"question_id": "6d6b58c0-9910-468e-87b8-4ee7cff2d9b2", "skill": "writing", "text": "Some people think that working from home (remote work) is better for both employees and companies. They say it gives flexible hours, saves travel time, and helps people balance work and family. Others believe that working in an office is better because it helps staff meet colleagues, learn skills, and improve their careers. Discuss both views and give your own opinion.\n\nIn your essay, include the following:\n- Explain the main reasons people prefer working from home and how it can help workers and employers (for example: flexible hours, less travel, lower office costs).\n- Explain the main reasons people prefer office work and how it can help career development and teamwork (for example: learning from colleagues, clear work routine, better communication).\n- Give your opinion on which is better overall or suggest a balance between the two. Mention one practical idea that could help both employees and companies (for example: a hybrid work schedule with some office days).\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "B1", "predicted_level": "B2", "level_change_reason": "Changed from B1 to B2: The prompt requires discussing abstract professional topics and structuring a multi-perspective argument, which aligns with B2 level complexity.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 33.437}, {"question_id": "17407bee-5774-47b2-b972-77d7ee669555", "skill": "writing", "text": "Contemporary policy debates in liberal democracies are increasingly characterised by performative rhetoric, reductive binaries, and the selective mobilisation of facts. Some commentators maintain that these distortions are an ineluctable consequence of electoral competition and media imperatives; others contend that they erode public deliberation and subvert evidence-informed governance. Two-part question: (a) To what extent do you agree or disagree that electoral incentives and media dynamics make substantive, evidence-based policy discourse inevitably marginalised? (b) Propose and critically evaluate two specific reforms-institutional, regulatory or civic-that could recalibrate policy discourse to be more deliberative, transparent and epistemically rigorous, taking into account feasibility and potential unintended consequences.\n\nIn your essay, address the following:\n- Analyse the chief mechanisms by which electoral incentives, partisan strategy and media logics distort policy discourse.\n- Describe two concrete reforms (for example, alterations to political finance, media regulation, parliamentary procedure, civic education or the establishment of deliberative forums) and assess their likely effectiveness and limitations.\n- Consider the trade-offs these reforms would entail, especially regarding free expression, political pluralism and governability.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "C2", "predicted_level": "C1", "level_change_reason": "Changed from C2 to C1: The prompt utilizes highly specialized academic vocabulary and complex grammatical structures to address abstract, nuanced political theories.", "qc_label": "REJECT", "qc_reason": "Fairness (requires specialist or cultural knowledge): The prompt requires knowledge of political science concepts and institutional mechanisms, such as parliamentary procedure and political finance, to provide a substantive answer.; Fairness (cultural bias): The item assumes the political framework and norms of liberal democracies as the universal context for discussing governance and policy.; predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 76.886}, {"question_id": "cb35e0dd-57a6-4cce-9cd5-823031927049", "skill": "writing", "text": "You have recently started a new job that involves long hours sitting at a desk. You used to be more active, but now you feel tired and worried about your health. Write a personal letter to your friend Alex, who often goes running and knows about simple home exercises. In your letter, include the following:\n\n- describe your current daily routine and the health or fitness problems you are facing (for example, low energy, back pain, or weight gain)\n- ask Alex for practical advice on easy, low-cost exercises you can do at home or near your office (mention one or two types, for example cardio - such as brisk walking or cycling - or strength training - like bodyweight exercises) and ask for a simple weekly plan\n- invite Alex to help you stay motivated: suggest meeting once a week, joining a free local class, or asking Alex to check your progress and give tips\n\nWrite at least 150 words. You should spend about 20 minutes on this task.", "level": "B1", "predicted_level": "B1", "level_change_reason": "The task requires describing personal experiences, expressing feelings, and asking for advice on a familiar topic using a range of tenses and specific vocabulary.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 37.993}, {"question_id": "8a64f02f-cccb-478b-809c-4bfc3ff193ad", "skill": "writing", "text": "Some people believe that the government should spend more money on public sports facilities and run health campaigns to help people stay fit. Others say that individuals are responsible for their own health and must make their own choices about diet and exercise. Discuss both views and give your own opinion.\n\nIn your essay, include the following:\n- Who should take action or pay to improve public health (for example, government, employers, families)?\n- The advantages and disadvantages of government-led programmes compared with personal responsibility.\n- Give some examples of simple ways to encourage healthy habits, such as public parks, community exercise classes, or education about diet.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "B1", "predicted_level": "B2", "level_change_reason": "Changed from B1 to B2: The prompt requires discussing an abstract societal issue using complex sentence structures and comparative language, which aligns with B2 descriptors for handling complex topics.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 33.152}, {"question_id": "0c3233ee-1b73-45a5-857b-7d5a20be2e51", "skill": "writing", "text": "Many young people find it hard to manage their money. They may borrow too much, spend quickly, or fail to save for the future. Some people think schools should teach money skills, while others believe families or the government should help. Discuss the causes of money problems for young people and suggest solutions.\n\nIn your essay, include the following:\n- Explain two main causes of money problems for young people (for example, lack of a budget - a simple plan for spending and saving - or easy access to credit).\n- Describe two practical solutions that schools, parents, or the government could use (for example, lessons about saving and simple banking, or rules about loans).\n- Give one short example of how a young person could change their behaviour to improve their financial situation.\n\nWrite at least 250 words.", "level": "B1", "predicted_level": "B2", "level_change_reason": "Changed from B1 to B2: The prompt requires discussing abstract social issues and providing structured arguments using nuanced vocabulary and complex sentence structures.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 35.023}, {"question_id": "7d8b817e-240c-4d13-a1e4-19a261cc076f", "skill": "writing", "text": "You booked a seven-day holiday through a local travel company. When you returned, several parts of the trip were not as described in the brochure or your itinerary (planned schedule). Write a letter to the manager of the travel company. Explain the situation and request a suitable response.\n\nIn your letter, include the following:\n- Describe your booking (dates and destination) and the specific problems you experienced (for example, late airport transfer, poor hotel room, or a cancelled excursion).\n- Explain how these problems affected your holiday (lost time, extra costs, missed activities or disappointment).\n- Say what you would like the company to do to put things right and suggest one way they could improve their service in the future.\n\nWrite at least 150 words. You should spend about 20 minutes.", "level": "B1", "predicted_level": "B2", "level_change_reason": "Changed from B1 to B2: The task requires a formal register, nuanced vocabulary (e.g., 'itinerary', 'excursion'), and the ability to explain cause-and-effect relationships in a structured, detailed text.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 33.83}, {"question_id": "250ce48e-da80-4265-a397-17e3487b3671", "skill": "writing", "text": "Some people believe that local cultural events, such as traditional festivals and community arts shows, are important and deserve public funding. They say these events bring visitors, help small businesses, and keep local heritage (things from the past) alive. Others think that governments should spend money on public services like healthcare and education instead of cultural events. Discuss both views and give your own opinion.\n\nIn your essay, include the following:\n- Explain reasons why people support public funding for cultural events (for example, tourism, community identity).\n- Explain reasons why people think funds should go to public services instead (for example, high costs, essential needs).\n- State your own opinion and suggest how governments could balance spending between cultural events and public services.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "B1", "predicted_level": "B2", "level_change_reason": "Changed from B1 to B2: The prompt requires discussing an abstract societal issue using complex sentence structures and academic vocabulary typical of upper-intermediate argumentation.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 32.6}, {"question_id": "a3efe14d-da8f-49e4-ac70-89d138894edc", "skill": "writing", "text": "Some people believe that teaching young people about money and how to manage it should be part of school lessons. Others think that parents or other family members should be responsible for this education. Discuss both views and give your own opinion.\n\nIn your essay, include the following:\n- Explain why financial education (basic knowledge about money, saving, spending and making a simple budget) might be useful in school.\n- Describe reasons why parents or family could be better teachers about money.\n- State your opinion and give one or two clear examples to support your view.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "B1", "predicted_level": "B2", "level_change_reason": "Changed from B1 to B2: The prompt requires discussing an abstract topic and contrasting two viewpoints using complex sentence structures, which aligns with B2 descriptors.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 32.43}, {"question_id": "1da25617-39e9-499a-b5e9-c5eab46c2423", "skill": "writing", "text": "You recently left a job as assistant manager at a local store. You are applying for a new position and need a reference from your previous manager. Write a letter to your former manager, Ms. Lopez, asking her to provide a reference (a reference is a letter or email that supports your job application).\n\nIn your letter, include the following:\n- Explain why you need the reference and name the job you are applying for.\n- Remind Ms. Lopez of two tasks or achievements from your previous job that are relevant to the new position.\n- Say how she can send the reference (email or phone), when you need it by, and offer to provide your CV or more information.\n\nWrite at least 150 words. You should spend about 20 minutes on this task.", "level": "B1", "predicted_level": "B1", "level_change_reason": "The task requires describing work experiences and professional needs using standard workplace vocabulary and a range of tenses, which aligns with B1 level descriptors for familiar work-related matters.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 54.531}, {"question_id": "dbe6163f-bf07-4066-8412-e170094d453e", "skill": "writing", "text": "You are writing to a friend who moved to another city six months ago. You have lost touch and would like to reconnect. Write a letter to your friend. In your letter, include the following:\n- explain why you have not been in contact recently (be honest but polite);\n- describe one thing you miss about your friendship or a shared memory that mattered to you;\n- suggest a plan for meeting or staying in touch and ask one question to encourage a reply.\n\nWrite at least 150 words. You should spend about 20 minutes on this task.", "level": "B1", "predicted_level": "B1", "level_change_reason": "The task requires describing personal experiences and explaining reasons within a familiar social context, which aligns with B1 descriptors.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 36.035}, {"question_id": "d2fae485-6b22-4f5f-bb72-6b9f403b4674", "skill": "writing", "text": "Some people believe that social media and smartphones help people keep in touch with friends and family, even when they live far away. Others think these technologies make friendships weaker because people meet and talk less in person. Discuss both views and give your own opinion.\n\nIn your essay, include the following points:\n- How using phones and social media can help people stay close to family and old friends.\n- Why some people feel that online contact makes relationships less deep.\n- What individuals or communities can do to keep strong social relationships.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "B1", "predicted_level": "B2", "level_change_reason": "Changed from B1 to B2: The prompt requires discussing an abstract topic with opposing viewpoints and structured argumentation, which aligns with B2 level complexity in both vocabulary and task demand.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 34.806}, {"question_id": "b6170501-8161-4e04-a6ce-be2c0dbde09b", "skill": "writing", "text": "Some people believe that small actions by individuals, such as recycling, saving energy at home, or using public transport, are the best way to protect the environment. Others argue that governments and large companies should take the main responsibility because they set laws and control industry pollution (emissions are the gases released into the air). Discuss both views and give your own opinion.\n\nIn your essay, include the following:\n- Explain why some people think individuals have the biggest role in protecting the environment.\n- Explain why others believe governments and companies must take the lead.\n- Give your own opinion and support it with reasons and examples.\n\nWrite at least 250 words.", "level": "B1", "predicted_level": "B2", "level_change_reason": "Changed from B1 to B2: The prompt requires discussing an abstract social issue using complex sentence structures and nuanced vocabulary such as 'emissions' and 'responsibility'.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 29.785}, {"question_id": "6ac1b6b1-9ca5-482c-8d89-36c24cf997a1", "skill": "writing", "text": "Many people today lead a sedentary lifestyle (they sit for most of the day) and do not get enough physical activity. This change has caused more health problems such as obesity, diabetes and heart disease. Write a problem-solution essay on this topic.\n\nIn your essay, include the following:\n- Explain the main reasons why many people are inactive.\n- Describe the problems this causes for individuals and for society.\n- Suggest practical solutions that individuals, workplaces and governments could try to improve health and fitness.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "B1", "predicted_level": "B2", "level_change_reason": "Changed from B1 to B2: The task requires producing a detailed essay on an abstract societal topic using academic vocabulary such as 'sedentary lifestyle' and 'obesity'.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 28.147}, {"question_id": "c9552add-130e-4874-b952-dc13257441da", "skill": "writing", "text": "You are on a short trip. Write a short postcard to your friend. Start with a greeting and end with a short goodbye. In your letter, include the following:\n- How many days you stay.\n- How many people are with you.\n- How many photos you take.\n\nWrite at least 40 words.", "level": "A1", "predicted_level": "A1", "level_change_reason": "The prompt requires only high-frequency vocabulary and the communication of basic facts using simple sentence structures.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 29.665}, {"question_id": "532a73ad-3c82-495f-bb1b-1b6dc42e2e18", "skill": "writing", "text": "You have a new home. Write a short note to a friend about your home.\nIn your letter, include the following:\n- Where you live.\n- One room you like and why.\n- Who you live with or ask your friend to visit.\nStart with Dear and end with a short closing.\n\nWrite at least 40 words. You have 10 minutes.", "level": "A1", "predicted_level": "A2", "level_change_reason": "Changed from A1 to A2: The task requires describing personal information and providing simple reasons using everyday vocabulary and basic connectors.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 31.972}, {"question_id": "20bb8b09-a6ef-4466-a759-43671c7e5c75", "skill": "writing", "text": "You are on a short trip away from home. Write a short note to a friend or a family member. Start with a greeting. Write one or two short sentences about your daily routine. End with a short closing.\n\nIn your letter, include the following:\n- When you wake up and when you go to bed.\n- What you do in the morning and what you do in the evening.\n- One thing you do in your free time.\n\nWrite at least 40 words.", "level": "A1", "predicted_level": "A1", "level_change_reason": "The task requires high-frequency vocabulary and simple present tense sentences to describe a basic daily routine.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 27.308}, {"question_id": "0d687764-83a1-4b17-a5b3-7fc99b28dac3", "skill": "writing", "text": "Contemporary societies valorise 'evidence-based' decision-making, yet foundational disputes persist in epistemology about what legitimately counts as knowledge. Some philosophers and policymakers maintain that the scientific method - with its emphasis on hypothesis-testing, reproducibility and empirical falsifiability - is the pre-eminent and perhaps sole reliable route to justified belief. Others argue that other epistemic conduits - testimony, tradition, expert judgment, and sometimes intuition - possess legitimate epistemic standing, particularly in domains where controlled experimentation is impracticable (ethical deliberation, historical interpretation, certain public-policy judgments).\n\nThis is a two-part task. First, to what extent do you agree or disagree that scientific methodology is the only dependable means of acquiring knowledge? Second, should non-scientific forms of knowing be afforded significant epistemic weight when governments formulate policy, or should policy-making be constrained strictly by empirical science? Answer both parts and articulate your own considered position.\n\nIn your essay, address the following points in a cohesive, advanced argumentative register:\n1. Precisely define the central epistemic concepts you invoke (for example, 'knowledge', 'justification', 'reliability') and clarify the normative stakes of privileging one epistemic route over others.\n2. Critically assess the strengths and limitations of the scientific method as an epistemic practice (consider issues such as scope, fallibility, theory-ladenness, and the role of modelling and inference to the best explanation).\n3. Evaluate the epistemic credentials of testimony, tradition, expert judgement and intuition, indicating where (if anywhere) they may legitimately supplement or supplant empirical inquiry.\n4. Examine the practical implications for public policy and democracy of either privileging scientific epistemology exclusively or adopting a pluralistic epistemic framework (consider trust, legitimacy, and risk management).\n5. Conclude with a nuanced, well-defended stance that recognises counterarguments and delineates the conditions under which various epistemic sources should inform collective decision-making.\n\nWrite at least 250 words.", "level": "C2", "predicted_level": "C1", "level_change_reason": "Changed from C2 to C1: The text employs highly specialized academic vocabulary and complex, abstract grammatical structures characteristic of advanced argumentative discourse.", "qc_label": "REJECT", "qc_reason": "Fairness (requires specialist or cultural knowledge): The prompt requires the application of specific philosophical concepts (e.g., 'theory-ladenness' and 'inference to the best explanation') that test subject-matter expertise rather than just language proficiency.; predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 81.69}, {"question_id": "46076803-1e2e-45f8-9959-b6693ca3acbd", "skill": "writing", "text": "You often take the city bus to go to work. Last week one bus did not come and the next bus was very late, so you were late for an important meeting. Write a letter to your friend about this problem. In your letter, include the following:\n- what happened and when it happened\n- how the delay affected you and how you felt\n- what you want to happen next or what you will do after this\n\nWrite at least 60 words. You have 15 minutes.", "level": "A2", "predicted_level": "A2", "level_change_reason": "The prompt uses high-frequency everyday vocabulary and requires the use of simple past and future tenses to describe a personal experience.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 33.24}, {"question_id": "e0021c21-fefd-4f83-8fe4-0db678fade13", "skill": "writing", "text": "Economic inequality has become a prominent issue in many countries, with wealth and income increasingly concentrated in the hands of a small proportion of the population. This growing gap has prompted debate about its root causes, its broader effects on society and the economy, and the most effective ways to reduce it. Discuss the main causes of economic inequality in contemporary societies and propose practical solutions to address this problem. In your essay, include the following:\n- Analyse at least two causes of widening economic inequality (for example: technological change, unequal access to education, tax and welfare policies, or globalisation).\n- Explain the possible social and economic consequences that rising inequality may have for communities and the nation as a whole.\n- Propose and evaluate at least two realistic solutions, indicating who (governments, businesses, communities or individuals) should take responsibility and why these measures
