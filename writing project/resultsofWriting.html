could be effective.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "B2", "predicted_level": "C1", "level_change_reason": "Changed from B2 to C1: The prompt utilizes sophisticated academic vocabulary and complex sentence structures to require the analysis and evaluation of abstract socio-economic concepts.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 35.136}, {"question_id": "60f20f39-1022-44d5-b279-3ee5a0f6b7b7", "skill": "writing", "text": "Intellectual traditions have long debated whether certain abstract concepts-such as truth, justice and beauty-possess an ontological reality independent of human cognition, or whether they are contingent social constructs shaped by historical, cultural and linguistic contingencies. Some philosophers defend various forms of realism, arguing that these universals exist regardless of human perception; others advance constructivist or pragmatist accounts, maintaining that such concepts are products of human praxis and communicative conventions.\n\nWrite an essay in response to the proposition below.\n\nProposition: \"Truth, justice and beauty have an existence that is independent of human conceptual schemes.\"\n\nIn your essay, address the following points:\n- Critically evaluate the principal epistemological and ontological arguments for and against the independent existence of such universals (for example, moral realism versus social constructivism).\n- Consider the practical ramifications of adopting either stance for public policy, jurisprudence and educational practice - how would each view shape normative decision-making and institutional design?\n- State your own position clearly, qualify it where appropriate, and support your stance with reasoned argument and illustrative examples.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "C2", "predicted_level": "C1", "level_change_reason": "Changed from C2 to C1: The text employs highly specialized academic vocabulary and complex grammatical structures to discuss abstract philosophical concepts.", "qc_label": "REJECT", "qc_reason": "Fairness (requires specialist or cultural knowledge): The prompt requires specific academic knowledge of philosophical theories (e.g., moral realism, social constructivism) to evaluate arguments, which exceeds the scope of a language proficiency test.; predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 59.989}, {"question_id": "cc6607f8-6d28-464b-a6e8-4759ff4b7a58", "skill": "writing", "text": "The relationship between language and thought has long been contested within cognitive science and philosophy. Proponents of linguistic relativity (often associated with the Sapir-Whorf hypothesis) maintain that the lexical resources and grammatical scaffolding of a language materially shape habitual cognition and perceptual salience; critics insist that thought is primarily independent of language and that linguistic variation only superficially reflects deeper, language-neutral cognitive architectures. Discuss both views and give your own opinion. In your essay, address the following points in order: 1) the most cogent empirical and theoretical arguments marshalled in favour of linguistic determinism and relativism; 2) countervailing evidence and conceptual rebuttals - for example from bilingualism research, cross-linguistic experiments, and neuroscientific data - that complicate or undermine deterministic claims; 3) the ethical and policy implications for education, minority language maintenance, and intercultural communication if linguistic relativity were to be taken as substantially true.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "C2", "predicted_level": "C1", "level_change_reason": "Changed from C2 to C1: The text employs highly specialized academic vocabulary and complex, multi-clause sentence structures to discuss abstract, technical concepts.", "qc_label": "REJECT", "qc_reason": "Fairness (requires specialist or cultural knowledge): The prompt requires specific academic knowledge of cognitive science and linguistics, such as neuroscientific data and empirical arguments, which exceeds the scope of testing language proficiency.; predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 62.527}, {"question_id": "8a2d168e-d359-4287-aac3-2f7af980fd84", "skill": "writing", "text": "You are writing a letter to your friend Sam. You started a new hobby and you want to tell Sam about it, so you can invite Sam to join. Write a short informal letter with a clear opening and a simple closing. In your letter, include the following:\n- Say what the hobby is and what you do.\n- Say why you like this hobby and when you do it.\n- Invite Sam to try it with you and ask about Sam's hobbies.\n\nWrite at least 60 words. You have 15 minutes.", "level": "A2", "predicted_level": "A2", "level_change_reason": "The task focuses on everyday topics (hobbies) and immediate personal relevance using simple structures and common connectors.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 30.947}, {"question_id": "ce13820d-566d-48c1-bfc0-dfcdda224186", "skill": "writing", "text": "You are the director of a municipal community centre in a mid-sized city. Over the past year you have overseen a pilot programme intended to increase attendance at preventive health workshops and participation in neighbourhood recycling initiatives by using behavioural-economics techniques (for example: default enrolment, social-norm messaging, commitment devices and environmental cues). The pilot produced uneven results: while some interventions led to marked short-term improvements, others had negligible or ephemeral effects, and a few produced unintended consequences.\n\nWrite a semi-formal letter to the Chair of the City Health and Environment Committee outlining the situation and asking the Committee to approve funding for a revised, scaled-up programme grounded in behavioural-economics principles. In your letter, include the following:\n\n- A concise but analytical summary of the pilot's outcomes, citing the most salient data and identifying which behavioural mechanisms appeared to succeed or fail and why.\n- A proposal of two specific interventions you recommend for scale-up, each justified with reference to behavioural theory, anticipated benefits, and any foreseeable drawbacks or ethical considerations.\n- A clear request for the resources and structural support you need (e.g. budget, personnel, access to civic data) and a proposed evaluation framework and timeline to measure effectiveness and guard against negative side-effects; invite the Chair to a meeting to discuss next steps.\n\nWrite at least 150 words. You should spend about 20 minutes on this task.", "level": "C1", "predicted_level": "C1", "level_change_reason": "The task requires highly specialized professional vocabulary and the ability to construct complex, analytical, and nuanced arguments for a professional audience.", "qc_label": "REJECT", "qc_reason": "Fairness (requires specialist or cultural knowledge): The task requires the student to apply specific academic knowledge of behavioural economics to justify their writing, which goes beyond testing language proficiency.", "metric_flags": "none", "elapsed_sec": 42.584}, {"question_id": "ee182431-97a7-4c35-aaad-c82946f8cef6", "skill": "writing", "text": "You are a member of your city's Historical Society. The City Museum has announced a forthcoming permanent exhibition of artefacts and archives from the colonial era. Some community members have expressed concern that the exhibition's current framing perpetuates unbalanced narratives and omits the perspectives of formerly colonised peoples. Write a semi-formal letter to the Director of the City Museum to convey your considered position and to propose constructive measures.\n\nIn your letter, include the following:\n- Explain your principal concerns about the exhibition's interpretative framework and the ethical questions raised by retaining and displaying contested colonial objects; indicate whether you support repatriation, reinterpretation, or another course of action and justify your stance.\n- Propose robust, practical measures for collaborative curation with descendant communities and academic partners (for example, mechanisms for consultation, co-authorship of labels, restitution policies, or shared programming); outline why these would improve the exhibition's legitimacy.\n- Request specific outcomes and timelines from the museum (such as a schedule for public consultations, a review of provenance research, or a statement on repatriation); state any offer of assistance from your society and how you expect the museum to communicate changes to diverse audiences.\n\nWrite at least 150 words. You should spend about 20 minutes on this task.", "level": "C1", "predicted_level": "C1", "level_change_reason": "The prompt requires the use of highly specialized, abstract vocabulary and complex sentence structures to address sophisticated socio-political and academic topics.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 61.0}, {"question_id": "5499d103-68d4-4128-bd09-4fcc065f820c", "skill": "writing", "text": "Contemporary epistemology is riven by a fundamental contestation: one tradition affirms that knowledge consists in belief that is objectively justified by methods that progressively approximate reality; another insists that knowledge is inextricably embedded in social practices, power relations and language, so that epistemic authority is contingent and plural. Some argue that epistemic objectivity is attainable and necessary for cumulative progress, especially in science; others maintain that claims to universality occlude situated knowledges and perpetuate injustices.\n\nDiscuss both views and give your own reasoned position on the nature of knowledge and justification. In your essay, include the following:\n- An explication of the competing epistemological positions (objectivist vs. socially situated accounts);\n- A critical appraisal of their strongest supporting arguments and principal vulnerabilities, with reference to at least one concrete domain (for example, the natural sciences, legal reasoning, or everyday testimonial exchange);\n- Consideration of the practical ramifications of endorsing one account over the other for education, public discourse or policy-making.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "C2", "predicted_level": "C1", "level_change_reason": "Changed from C2 to C1: The text employs highly specialized academic vocabulary and complex, abstract grammatical structures characteristic of advanced discourse.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 49.535}, {"question_id": "74f1adbd-3925-4e1d-8150-f88e9893c4a4", "skill": "writing", "text": "You saw a notice at the town library about a local cultural event called the \"Spring Cultural Festival\" organised by your community centre. You are interested in attending and would like to offer your help as a volunteer. Write a letter to the community centre manager. Explain your interest and give relevant details.\n\nIn your letter, include the following:\n- Which part of the festival you are most interested in and why (for example: music performances, food stalls, or a craft exhibition). You may explain a topic word briefly if needed (e.g. stall = a small temporary shop).\n- Ask two clear questions about the event (for example: dates and times, entry cost, how to sign up as a volunteer, or what tasks volunteers do).\n- Offer to help or suggest one idea for the festival and explain what skills or experience you have and when you are available.\n\nWrite at least 150 words. You should spend about 20 minutes on this task.", "level": "B1", "predicted_level": "B1", "level_change_reason": "The task requires describing opinions, asking questions, and explaining personal experience and availability on a familiar social topic, which aligns with B1 descriptors.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 33.478}, {"question_id": "3967124c-6d6e-4914-98fd-0cc6388d716e", "skill": "writing", "text": "You are the chair of the Westbridge Literary Society. Last week the local periodical The Meridian Review published a review of last month_x0019_s panel discussion featuring visiting novelist Dr Elena Rousseau and several local critics. The review contains several substantive misinterpretations of the themes discussed, and it attributes quotations to Dr Rousseau that she did not make. These errors have caused reputational distress to the author and confusion among your membership. Write a letter to the editor of The Meridian Review expressing your concerns and seeking remedial action.\n\nIn your letter, include the following:\n- A concise but specific account of the inaccuracies and misrepresentations in the published review, citing at least two concrete examples (e.g. misattributed quotations, erroneous characterisations of the panel_x0019_s themes, incorrect factual details such as dates or venues).\n- An explanation of the ramifications these errors have for the author, your society and the wider readership, articulating why a correction or clarification is necessary to preserve professional integrity.\n- A clear proposal for how the journal might rectify the situation (for example, a published correction or an invitation for Dr Rousseau or your society to provide a right of reply), including a realistic timeframe and your preferred method of further communication.\n\nWrite at least 150 words. You should spend about 20 minutes on this task.", "level": "C1", "predicted_level": "C1", "level_change_reason": "The prompt requires the use of sophisticated, professional vocabulary and the ability to articulate complex, abstract arguments regarding professional integrity and reputational damage.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 34.403}, {"question_id": "6a2d1056-5a62-4cf5-9e60-0177cd87958c", "skill": "writing", "text": "You are the creative director of a small independent design studio. Recently you discovered that a large international online retailer is offering a product that appears to be a direct, unauthorised reproduction of one of your studio's registered designs. You need to write to the retailer's legal/compliance department to seek remediation and to prevent further misuse.\n\nIn your letter, include the following:\n- Describe the nature of the alleged intellectual property infringement: identify which design(s) are affected, how and when you discovered the unauthorised reproduction, and summarise any evidence you can provide (for example, product listings, photographs, design registration numbers or correspondence).\n- Explain the commercial and reputational impact on your studio; quantify losses or potential losses where possible, and state precisely what remedial actions you require (for instance, removal of listings, disclosure of supplier details, financial compensation or a licensing arrangement).\n- Propose a pragmatic timetable and mechanisms for resolving the matter, indicate the steps you will take if the retailer fails to cooperate (such as initiating legal proceedings or contacting marketplace hosts), and recommend preventative measures to avoid recurrence (contractual safeguards, verification protocols or take-down procedures).\n\nWrite at least 150 words. You should spend about 20 minutes on this task.", "level": "C1", "predicted_level": "C1", "level_change_reason": "The task requires highly specialized professional vocabulary and the ability to communicate complex, abstract legal and business concepts with nuance.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 42.901}, {"question_id": "f5dbf974-a64c-4a61-bc8f-a64242dd0141", "skill": "writing", "text": "You live in a small town where the local council has announced plans to install a medium-sized wind farm approximately one kilometre from the nearest houses. Some residents support the project because it will generate renewable energy for the area, while others are worried about possible negative effects. Write a letter to your friend who is active in the community to explain your position and to encourage them to become involved.\n\nIn your letter, include the following:\n- Your view of the proposed wind farm and the main reasons for your position, citing environmental and local considerations (for example: carbon reduction, noise, visual impact, effects on wildlife).\n- Specific concerns or benefits you foresee for residents and the local economy, and any compromises or alternative solutions you would suggest.\n- What you would like your friend to do (attend a meeting, help organise a petition, contact the council) and a proposed plan for taking action together.\n\n\nWrite at least 150 words. You should spend about 20 minutes.", "level": "B2", "predicted_level": "B2", "level_change_reason": "The prompt requires discussing abstract and concrete topics such as environmental impact and economic benefits using nuanced vocabulary and complex argumentation.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 33.457}, {"question_id": "4d1d34e9-ab82-46ea-80e4-b5925c9c0118", "skill": "writing", "text": "In recent decades many countries have experienced substantial immigration. This influx has provoked debate about whether immigration enriches or undermines national identity. Some people argue that newcomers invigorate society by introducing new customs, languages and skills, thereby strengthening a country's cultural life and economy. Others contend that large-scale immigration risks diluting shared traditions, causing social fragmentation and weakening national cohesion. Discuss both views and give your own opinion.\n\nIn your essay, include the following:\n1. Explain the main reasons why some people believe immigration benefits national identity and social life.\n2. Explain the main reasons why others worry immigration may threaten national identity and social cohesion.\n3. Suggest practical steps that governments or communities could take to balance cultural diversity with a sense of shared identity.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "B2", "predicted_level": "C1", "level_change_reason": "Changed from B2 to C1: The prompt utilizes advanced academic vocabulary (e.g., 'influx', 'undermines', 'fragmentation') and complex sentence structures to discuss abstract sociopolitical themes.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 33.78}, {"question_id": "747e6df4-9123-4229-b11e-ac097acdeba6", "skill": "writing", "text": "You recently attended the Maple Grove Community Health Centre for a routine appointment and a follow-up diagnostic test. On the day of your visit the appointment was delayed by more than three hours, your referral paperwork was misplaced, and you left without receiving your test results. A subsequent follow-up appointment was cancelled at short notice with no clear explanation. Because of these problems you missed work, experienced considerable anxiety about your health, and have found it difficult to get clear information from reception.\n\nWrite a letter to your friend Sara, who now works with the local health authority and may be able to help. In your letter, include the following:\n\n- Describe the problems you experienced at the clinic, giving specific details and dates where possible.\n- Explain how these issues affected your health, daily life and ability to work.\n- Say what action you would like Sara to take (for example, help escalate a complaint, obtain your test results, or liaise with the clinic) and suggest one realistic improvement the clinic could make to prevent this happening to others.\n\nWrite at least 150 words. You should spend about 20 minutes on this task.", "level": "B2", "predicted_level": "B2", "level_change_reason": "The prompt requires the use of nuanced vocabulary (e.g., 'liaise', 'escalate', 'subsequent') and complex grammatical structures to describe a multi-layered sequence of events and their consequences.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 32.037}, {"question_id": "6211dbdf-357b-46cf-a5f9-e1a20f1b84b3", "skill": "writing", "text": "Write a short note to a friend about your school. Start with a greeting and end with a closing. In your letter, include the following:\n- Where your school is.\n- One thing you like at school.\n- What you do after school.\n\nWrite at least 40 words. You have 10 minutes.", "level": "A1", "predicted_level": "A1", "level_change_reason": "The prompt requires only high-frequency vocabulary and simple present tense to describe basic facts and routines.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 29.368}, {"question_id": "19301c1b-295a-43ab-91ce-247947434841", "skill": "writing", "text": "You are on a trip. Write a short note to your friend Anna. Tell her about your family. In your letter, include the following:\n- Who is in your family.\n- What you like to do with them.\n- Ask Anna to visit your home.\n\nWrite at least 40 words.", "level": "A1", "predicted_level": "A1", "level_change_reason": "The prompt requires only high-frequency vocabulary about family and simple present tense to describe basic personal facts.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 32.155}, {"question_id": "5f8380ed-54f3-44c6-adfb-d8a45b6ab074", "skill": "writing", "text": "Artificial intelligence (AI) is increasingly integrated into everyday life and economic activity. Proponents contend that AI may substantially increase productivity, improve healthcare diagnostics, and expand educational opportunities; conversely, critics warn that it could lead to significant job displacement, exacerbate social inequalities, and create serious ethical and privacy problems. Discuss both views and give your own opinion.\n\nIn your essay, include the following:\n- Reasons why supporters believe AI will benefit individuals and society (for example, efficiency, innovation, improved services).\n- Main concerns raised by opponents of AI, including its potential impact on employment, fairness, and personal privacy.\n- Practical measures that governments, businesses, or individuals should adopt to manage the risks while maximising benefits.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "B2", "predicted_level": "C1", "level_change_reason": "Changed from B2 to C1: The prompt utilizes sophisticated academic vocabulary (e.g., 'proponents', 'exacerbate', 'displacement') and complex sentence structures to address an abstract, multi-faceted topic.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 37.644}, {"question_id": "fb0442fe-8bfe-4939-a35f-d1821b882fc2", "skill": "writing", "text": "Plastic pollution in rivers, lakes and oceans is a growing problem in many countries. This pollution can harm fish, birds and other animals, and it can also affect human health. In some places, small pieces of plastic called microplastics (tiny bits of plastic that come from larger items or from products like some toothpastes) are found in water and food.\n\nWrite an essay explaining the causes of plastic pollution and offering solutions. In your essay, include the following:\n- Describe two main reasons why plastic pollution has increased in recent years.\n- Suggest two practical solutions that could help reduce plastic pollution. Include one solution that governments or local authorities could use and one that people can do at home.\n- Say which solution you think is most important and explain why.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "B1", "predicted_level": "B2", "level_change_reason": "Changed from B1 to B2: The task requires discussing a complex, abstract topic and producing a structured, detailed essay with specific argumentative requirements.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 30.906}, {"question_id": "aff69f05-20bd-40c8-b60d-d605d1eb1708", "skill": "writing", "text": "Governments and international organisations have long defended intellectual property (IP) regimes - patents, copyrights and trademarks - as indispensable mechanisms for rewarding creativity, fostering investment and promoting technological progress. Critics, however, contend that overly expansive or rigid IP laws impede the diffusion of knowledge, entrench monopolies and exacerbate global inequalities, particularly between affluent and developing nations. \n\nWrite an essay discussing both sides of this debate and make clear which position you personally endorse. In your essay, include discussion of the following points in a structured and critical manner:\n\n1. The argument that robust IP protection is necessary to provide economic incentives for creators, to attract R&D funding, and to sustain cultural industries;\n2. The counter-argument that stringent IP rules can hamper follow-on innovation, limit access to essential medicines and educational resources, and privilege corporate interests over the public good;\n3. Practical difficulties in enforcing IP law across jurisdictions and the consequences of harmonisation versus flexibility in international treaties;\n4. Possible policy compromises or reforms that could reconcile the need to reward creators with wider social imperatives (for example, differential terms, compulsory licensing, open-access models or tiered pricing).\n\nWrite at least 250 words.", "level": "C1", "predicted_level": "C1", "level_change_reason": "The prompt utilizes highly specialized academic vocabulary and complex syntactic structures to address abstract, multi-faceted socio-economic issues.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 35.223}, {"question_id": "c3ca68e4-bb23-444c-b2e7-63a5ba147583", "skill": "writing", "text": "You got fruits and vegetables from your friend. Write a short note to your friend. Use a greeting and a closing. In your letter, include the following:\n- Say thank you for the fruits and vegetables.\n- Ask which fruits or vegetables are ready now.\n- Ask if your friend can bring some for you next week.\n\nWrite at least 40 words.", "level": "A1", "predicted_level": "A2", "level_change_reason": "Changed from A1 to A2: The task requires using everyday vocabulary and simple grammatical structures to communicate information of immediate personal relevance.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 30.812}, {"question_id": "285231e8-4ca2-4b5a-b808-39450d210aca", "skill": "writing", "text": "You are writing to your former doctoral supervisor, Professor Elena Márquez, who now chairs the university's Curriculum Review Committee. The committee is poised to recommend adoption of a novel, highly abstract conceptual framework for undergraduate social-science programmes - a framework whose ontological and epistemic premises you believe are both contentious and potentially deleterious to critical pedagogy. Your relationship with Professor Márquez is collegial but the matter is sensitive: colleagues hold divergent views and the recommendation will be debated at a faculty-wide meeting next month.\n\nIn your letter, include the following:\n- A concise, intellectually rigorous exposition of your principal objections to the framework's underlying assumptions and the tangible consequences you foresee for student learning, academic freedom, and interdisciplinary research; justify your points with conceptual clarity rather than polemical rhetoric.\n- Concrete alternative measures or amendments you would propose to the committee to preserve pluralism and methodological rigor in the curriculum (e.g. specific curricular revisions, assessment safeguards, or forms of stakeholder consultation), explaining why these are practicable and proportionate.\n- A clear request for action from Professor Márquez (for example, convening an advisory panel, delaying implementation pending broader consultation, or soliciting external expert reviews), and an offer of your own involvement, specifying what you can realistically contribute and any constraints on your availability.\n\nWrite at least 150 words. You should spend about 20 minutes on this task.", "level": "C2", "predicted_level": "C1", "level_change_reason": "Changed from C2 to C1: The prompt utilizes highly specialized academic vocabulary and requires the ability to navigate complex, abstract concepts within a nuanced professional context.", "qc_label": "REJECT", "qc_reason": "Fairness (requires specialist or cultural knowledge): The prompt requires the student to demonstrate expertise in specialized academic philosophy and social science theory (e.g., ontological and epistemic premises, critical pedagogy) rather than just language proficiency.; predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 50.685}, {"question_id": "61eee97e-54f0-4fa6-b285-f0446fa0a0d3", "skill": "writing", "text": "Many governments are expanding the use of public surveillance technologies - such as closed-circuit television (CCTV) and facial recognition systems - with the stated aim of reducing crime and improving public safety. Although these measures may strengthen law enforcement capabilities, they can also create significant social, ethical and legal difficulties. In your essay, analyse the main problems that could arise from increased public surveillance and propose realistic solutions to minimise these risks. In your essay, include the following:\n\n- The likely negative consequences for individuals and society (for example: infringements of privacy, risks of biased profiling, and potential abuse of power).\n- Practical, legal or technical measures that governments, organisations or citizens could adopt to address these problems (for example: clearer regulation, independent oversight, transparency and technological safeguards).\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "B2", "predicted_level": "C1", "level_change_reason": "Changed from B2 to C1: The prompt requires the use of sophisticated academic vocabulary and the analysis of complex, abstract social and ethical topics.", "qc_label": "REVIEW", "qc_reason": "predicted CEFR level outside defined range of labeled level", "metric_flags": "none", "elapsed_sec": 125.111}, {"question_id": "18aebd15-3f67-4793-85e3-ac650001efa9", "skill": "writing", "text": "You are a long-term resident in a mid-sized town and an active member of a local patient-advocacy group. A regional research team has announced a proposed study at the community clinic involving genetic screening and longitudinal data collection from older adults, some of whom may have mild cognitive impairment. You are concerned that certain procedural and ethical safeguards have not been made explicit in the public summary and that vulnerable participants could be exposed to undue risk.\n\nWrite a letter to the principal investigator, Dr S. Patel, expressing your concerns and seeking clarification. In your letter, include the following:\n- Precisely describe the specific ethical issues that worry you (for example, informed consent procedures for cognitively impaired participants, selection criteria, potential for stigmatization, and data privacy/sharing arrangements).\n- Propose concrete amendments or safeguards the research team should implement to mitigate those concerns (for example, independent advocacy during consent, enhanced anonymisation, restricted data-sharing protocols, or revised inclusion criteria).\n- State the response you expect from Dr Patel and suggest how you and your advocacy group could be involved in monitoring or advising the project, including any timescale for a reply or meeting.\n\nWrite at least 150 words. You should spend about 20 minutes on this task.", "level": "C1", "predicted_level": "C1", "level_change_reason": "The task requires the use of highly specialized, academic vocabulary and the ability to construct a formal, nuanced argument regarding complex ethical and professional topics.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 44.019}, {"question_id": "52186284-b4cb-4cf8-b3f6-afd1ca3f445b", "skill": "writing", "text": "Urbanisation is increasing rapidly in many countries, bringing both economic opportunities and significant social and environmental pressures. Some argue that urban growth stimulates development and innovation, while others contend that it causes overcrowding, pollution and a decline in quality of life. Write a problem-solution essay in which you analyse the main problems resulting from rapid urbanisation and propose realistic measures to tackle them. In your discussion, consider how effective these measures might be and who should take responsibility for implementing them.\n\nIn your essay, include the following:\n1. Identify the primary causes of accelerated urbanisation in contemporary societies.\n2. Describe two major problems that arise from this trend (for example: housing shortages, traffic congestion, environmental damage, or strained public services).\n3. Suggest practical solutions to these problems and explain which organisations or groups (local authorities, national governments, private companies, communities or individuals) should be responsible for carrying them out and why.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "B2", "predicted_level": "B2", "level_change_reason": "The text employs complex sentence structures and sophisticated academic vocabulary to discuss abstract societal issues.", "qc_label": "SELECT", "qc_reason": "meets all QC targets", "metric_flags": "none", "elapsed_sec": 43.934}, {"question_id": "a6e97718-d1ce-4a00-80cb-d9ff8cae21ce", "skill": "writing", "text": "A persistent debate in literary studies concerns the aims and methods of criticism. Some scholars argue that literary criticism ought to aspire to objective, text-centred analyses grounded in historical and authorial contexts, thereby preserving rigorous standards for assessing artistic merit. Others contend that criticism should be pluralistic and reader-oriented, embracing subjective response, contemporary ethical frameworks and marginalized voices, even if this means revising established canons. Discuss both these views and give your own opinion. In your essay, include the following:\n\n- To what extent should authorial intent and historical context delimit permissible interpretations of a text?\n- Compare the merits and limitations of formalist/textual analysis versus reader-response and sociocultural approaches to criticism.\n- Consider whether and how the literary canon ought to be revised in light of contemporary ethical, identity-based and postcolonial critiques.\n\nWrite at least 250 words. You should spend about 40 minutes on this task.", "level": "C1", "predicted_level": "C1", "level_change_reason": "The text employs highly specialized academic vocabulary and complex, formal grammatical structures to discuss abstract theoretical concepts.", "qc_label": "REJECT", "qc_reason": "Fairness (requires specialist or cultural knowledge): The prompt requires specific knowledge of literary theory and academic terminology (e.g., formalist analysis, reader-response theory) that is outside the scope of general language proficiency.", "metric_flags": "none", "elapsed_sec": 45.558}, {"question_id": "6713ba65-2275-4937-8cdd-2abc06567006", "skill": "writing", "text": "You are a senior researcher who has discovered that a close colleague publicly mischaracterised your conceptual framework during a widely attended interdisciplinary symposium. The colleague attributed to you a reductive, deterministic interpretation that is antithetical to the nuanced, probabilistic ontology you have advanced; this misrepresentation has since been cited informally by funders and junior researchers and may prejudice an imminent collaborative grant decision. You decide to write a letter to that colleague to address the matter directly and to seek an amicable, professional resolution.\n\nIn your letter, include the following:\n- A concise but intellectually rigorous clarification of your theoretical position that corrects the specific mischaracterisation; explain the core principles and why the colleague's framing is inaccurate without adopting an adversarial tone.\n- An assessment of the potential professional and ethical ramifications if the misrepresentation remains unrectified (e.g. effects on funding outcomes, junior scholars' interpretations, and scholarly integrity), emphasising why a prompt response is necessary.\n- A concrete, collegial proposal for remediation (for example: a joint statement to the symposium organisers, a short corrigendum circulated to relevant stakeholders, or a publi const els = {
  stats: document.getElementById('stats'),
  rows: document.getElementById('rows'),
  empty: document.getElementById('empty'),
  search: document.getElementById('search'),
  skillFilter: document.getElementById('skill-filter'),
  levelFilter: document.getElementById('level-filter'),
  backdrop: document.getElementById('backdrop'),
  drawer: document.getElementById('drawer'),
  genSub: document.getElementById('generated-sub'),
};

let activeDecision = 'all';

function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function decisionOf(row){ return (row.qc_label || '').toLowerCase(); }
function badgeClass(value){
  const v = (value || '').toUpperCase();
  if (v.includes('SELECT')) return 'select';
  if (v.includes('REVIEW')) return 'review';
  if (v.includes('REJECT')) return 'reject';
  return '';
}

function buildStats(){
  const counts = {select:0, review:0, reject:0};
  DATA.forEach(r => { const d = decisionOf(r); if (counts[d] !== undefined) counts[d]++; });
  const total = DATA.length;
  els.stats.innerHTML = `
    <div class="stat"><div class="n">${total}</div><div class="l">Total items</div></div>
    <div class="stat select"><div class="n">${counts.select}</div><div class="l">Select</div></div>
    <div class="stat review"><div class="n">${counts.review}</div><div class="l">Review</div></div>
    <div class="stat reject"><div class="n">${counts.reject}</div><div class="l">Reject</div></div>
  `;
  els.genSub.textContent = `Generated 2026-07-23 16:37:45 &middot; ${total} items reviewed`;
}

function buildFilterOptions(){
  const skills = [...new Set(DATA.map(r => r.skill).filter(Boolean))].sort();
  const levels = [...new Set(DATA.map(r => r.predicted_level || r.level).filter(Boolean))].sort();
  skills.forEach(s => els.skillFilter.insertAdjacentHTML('beforeend', `<option value="${esc(s)}">${esc(s)}</option>`));
  levels.forEach(l => els.levelFilter.insertAdjacentHTML('beforeend', `<option value="${esc(l)}">${esc(l)}</option>`));
}

function levelCell(row){
  const labeled = row.level || '—';
  const predicted = row.predicted_level || '—';
  const changed = labeled !== '—' && predicted !== '—' && labeled !== predicted;
  return `<span class="level mono">${esc(labeled)}<span class="arrow">&rarr;</span><span class="${changed ? 'changed' : ''}">${esc(predicted)}</span></span>`;
}

function textPreview(row){
  return row.text || '(no text)';
}

function matchesFilters(row){
  if (activeDecision !== 'all' && decisionOf(row) !== activeDecision) return false;
  if (els.skillFilter.value && row.skill !== els.skillFilter.value) return false;
  if (els.levelFilter.value && (row.predicted_level || row.level) !== els.levelFilter.value) return false;
  const q = els.search.value.trim().toLowerCase();
  if (q){
    const hay = [textPreview(row), row.qc_reason, row.level_change_reason, row.metric_flags].join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function render(){
  const filtered = DATA.filter(matchesFilters);
  els.empty.style.display = filtered.length ? 'none' : 'block';
  els.rows.innerHTML = filtered.map((row) => {
    const idx = DATA.indexOf(row);
    const decision = decisionOf(row) || 'review';
    return `
      <tr data-idx="${idx}">
        <td class="mono">${esc(row.question_id || idx)}</td>
        <td>${esc(row.skill)}</td>
        <td class="q-preview" title="${esc(textPreview(row))}">${esc(textPreview(row))}</td>
        <td>${levelCell(row)}</td>
        <td><span class="badge ${decision}">${esc(decision)}</span></td>
        <td class="reason-preview" title="${esc(row.qc_reason)}">${esc(row.qc_reason)}</td>
      </tr>`;
  }).join('');
  [...els.rows.querySelectorAll('tr')].forEach(tr => {
    tr.addEventListener('click', () => openDrawer(parseInt(tr.dataset.idx, 10)));
  });
}

function openDrawer(idx){
  const row = DATA[idx];
  const decision = decisionOf(row) || 'review';
  els.drawer.innerHTML = `
    <button class="drawer-close" onclick="closeDrawer()">&times;</button>
    <h2>${esc(row.question_id || idx)} &mdash; <span class="badge ${decision}">${esc(decision)}</span></h2>
    <div class="drawer-sub">${esc(row.skill)} &middot; labeled ${esc(row.level||'—')} &rarr; predicted ${esc(row.predicted_level||'—')}</div>

    <div class="block"><div class="k">Text</div><div class="v">${esc(textPreview(row))}</div></div>
    <div class="block"><div class="k">QC reason</div><div class="v"><strong>${esc(row.qc_reason)}</strong></div></div>
    <div class="block"><div class="k">Level reason</div><div class="v">${esc(row.level_change_reason)}</div></div>
    <div class="block"><div class="k">Rule-based flags</div><div class="v mono">${esc(row.metric_flags)}</div></div>
    ${row.elapsed_sec !== undefined && row.elapsed_sec !== '' ? `<div class="block"><div class="k">Processing time</div><div class="v mono">${esc(row.elapsed_sec)}s</div></div>` : ''}
  `;
  els.backdrop.classList.add('open');
}
function closeDrawer(){ els.backdrop.classList.remove('open'); }
els.backdrop.addEventListener('click', e => { if (e.target === els.backdrop) closeDrawer(); });

[...document.querySelectorAll('.chip')].forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeDecision = chip.dataset.val;
    render();
  });
});
els.search.addEventListener('input', render);
els.skillFilter.addEventListener('change', render);
els.levelFilter.addEventListener('change', render);

buildStats();
buildFilterOptions();
render();
</script>
</body>
</html>
